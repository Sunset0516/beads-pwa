<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b9d"/>
      <stop offset="0.3" stop-color="#ffa94d"/>
      <stop offset="0.55" stop-color="#ffd43b"/>
      <stop offset="0.75" stop-color="#69db7c"/>
      <stop offset="0.88" stop-color="#4dabf7"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" ry="110" fill="url(#bg)"/>
  <!-- 钉板白底 -->
  <rect x="116" y="116" width="280" height="280" rx="60" ry="60" fill="#ffffff" opacity="0.95" filter="url(#sh)"/>
  <!-- 3x3 彩色拼豆 -->
  <g filter="url(#sh)">
    <circle cx="186" cy="186" r="34" fill="#ff6b9d"/>
    <circle cx="256" cy="186" r="34" fill="#ffd43b"/>
    <circle cx="326" cy="186" r="34" fill="#4dabf7"/>
    <circle cx="186" cy="256" r="34" fill="#69db7c"/>
    <circle cx="256" cy="256" r="34" fill="#7c5cff"/>
    <circle cx="326" cy="256" r="34" fill="#ffa94d"/>
    <circle cx="186" cy="326" r="34" fill="#4dabf7"/>
    <circle cx="256" cy="326" r="34" fill="#ff6b9d"/>
    <circle cx="326" cy="326" r="34" fill="#69db7c"/>
  </g>
  <!-- 高光小点 -->
  <g fill="#ffffff" opacity="0.45">
    <circle cx="176" cy="176" r="7"/>
    <circle cx="246" cy="176" r="7"/>
    <circle cx="316" cy="176" r="7"/>
    <circle cx="176" cy="246" r="7"/>
    <circle cx="246" cy="246" r="7"/>
    <circle cx="316" cy="246" r="7"/>
    <circle cx="176" cy="316" r="7"/>
    <circle cx="246" cy="316" r="7"/>
    <circle cx="316" cy="316" r="7"/>
  </g>
</svg>
